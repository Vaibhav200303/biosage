[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biosage"
version = "0.1.0"
description = "Evidence-grounded biodiversity and farm restoration assistant"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "streamlit>=1.38,<2",
  "scikit-learn>=1.5,<2",
  "google-genai>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
