[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biosage"
version = "0.1.0"
description = "Evidence-grounded biodiversity and farm restoration assistant"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.13.4",
  "streamlit==1.64.0",
  "scikit-learn==1.7.2",
  "Pillow==12.3.0",
  "google-genai==1.75.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.3"]

[tool.setuptools]
packages = ["biosage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
